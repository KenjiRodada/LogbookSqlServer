<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ | Logbook</title><link rel="stylesheet" href="css/style.css"></head><body class="login-page"><main class="login-card"><div class="brand login-brand"><span class="brand-icon">L</span><div><b>LOGBOOK</b><small>ระบบข้อมูลการช่วยเหลือ</small></div></div><h1>เข้าสู่ระบบ</h1><p class="muted">กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูล</p><form id="loginForm"><label>ชื่อผู้ใช้<input id="username" autocomplete="username" required></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" hidden></p><button class="button" type="submit">เข้าสู่ระบบ</button></form><small class="muted">ต้องตั้งค่าบัญชีผู้ดูแลระบบก่อนใช้งานครั้งแรก</small></main><script src="js/login.js"></script></body></html>
